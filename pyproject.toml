[project]
name = "open-ai-26-6-5"
version = "0.1.0"
description = "OpenAI course notebooks: basics, function calling, RAG, embeddings, multimodal, gradio"
requires-python = ">=3.11,<3.13"
dependencies = [
    "openai",
    "python-dotenv",
    "ipython",
    "ipykernel",
    "jupyter",
    "notebook",
    "nbconvert",
    "requests",
    "beautifulsoup4",
    "pandas",
    "numpy",
    "matplotlib",
    "plotly",
    "scikit-learn",
    "scipy",
    "pillow",
    "gradio",
    "chromadb",
    "pydantic",
    "tqdm",
    "tenacity",
    "tiktoken",
    "pypdf",
    "google-genai",
    "litellm",
    "langchain-core",
    "langchain-community",
    "langchain-openai",
    "langchain-chroma",
    "langchain-huggingface",
    "langchain-text-splitters",
    "sentence-transformers>=3.0,<4",
    "networkx",
    "nltk<3.9",
    "spacy>=3.8,<3.9",
    "transformers>=4.40,<5",
    "tokenizers",
    "sentencepiece",
    "en-core-web-sm",
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
